name: Launchpad launch check for AI-built apps
description: Checks an AI-built app for what breaks at launch and comments each fix on the pull request.
author: Axonscape
branding:
  icon: shield
  color: blue
inputs:
  path:
    description: The app's folder in the repository.
    default: "."
  domain:
    description: The app's domain, to check its email records too (SPF, DKIM, DMARC). Optional.
    default: ""
  comment:
    description: Comment the report on pull requests, and keep that one comment up to date. Needs "pull-requests write".
    default: "true"
  fail-on:
    description: When the job fails. "fail" for anything to fix before launch, "warn" for anything to fix at all, "never" to only report.
    default: "fail"
  github-token:
    description: The token that comments. The workflow's own token is enough.
    default: ${{ github.token }}
outputs:
  score:
    description: The launch score, out of 100.
  fails:
    description: How many things to fix before launch.
  warns:
    description: How many things worth fixing.
runs:
  using: node24
  main: dist/index.mjs
